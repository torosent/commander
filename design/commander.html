<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commander</title>
<style>
:root{--case:#262523;--deck:#1E1D1C;--rim:#000;--line:#3A3936;--ink:#ECE8DE;--dim:#A7A296;--cur:#D9D5CA;--cur-ink:#1A1917;--field:#161514;
--go:#3FA34D;--go-hi:#58C168;--go-ink:#0D240F;--go-t:#86DC94;--go-bg:rgba(63,163,77,.2);
--mv:#F2B705;--mv-hi:#FFD24E;--mv-ink:#2F2300;--mv-t:#F7CF58;--mv-bg:rgba(242,183,5,.17);
--rm:#D23C2A;--rm-hi:#EC6A59;--rm-ink:#fff;--rm-t:#F6A094;--rm-bg:rgba(210,60,42,.22);
--key:#3A3834;--key-hi:#55524C;--key-ink:#ECE8DE;color-scheme:dark}
:root[data-theme=light]{--case:#DDD9CF;--deck:#F3F1EB;--rim:#B9B4A7;--line:#CFCABD;--ink:#1E1D1B;--dim:#5E5A51;--cur:#2B2A27;--cur-ink:#F3F1EB;--field:#FBFAF6;
--go-t:#1B6A28;--go-bg:rgba(63,163,77,.2);--mv-t:#6E5000;--mv-bg:rgba(242,183,5,.26);--rm-t:#A02719;--rm-bg:rgba(210,60,42,.15);
--key:#C9C5BA;--key-hi:#ECE9E1;--key-ink:#1E1D1B;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:38px minmax(0,1fr) 36px 30px;min-width:1000px;min-height:600px;background:var(--case);color:var(--ink);font:12px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;user-select:none}
::selection{background:var(--cur);color:var(--cur-ink)}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:default;padding:0}
:focus-visible{outline:2px solid var(--cur);outline-offset:1px}
.i{flex:none;display:inline-block;vertical-align:-2px}
kbd{font:inherit;color:var(--dim)}
.top{position:relative;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--rim)}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%}.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.cmd{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:360px;height:24px;border-radius:12px;background:var(--deck);color:var(--dim);display:flex;align-items:center;gap:8px;padding:0 12px}.cmd kbd{margin-left:auto}
#mini{margin-left:auto;color:var(--dim)}
#stage{min-height:0}
.view{display:none;height:100%;min-height:0}.view.on{display:grid;grid-template-columns:minmax(0,1fr)}
#v-browse{grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr)}
#v-rename.on,#v-compare.on{grid-template-rows:44px minmax(0,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);min-height:0}
.p{display:grid;grid-template-rows:28px 28px 22px minmax(0,1fr) 24px;min-height:0;background:var(--deck)}
.p.plain{grid-template-rows:28px 22px minmax(0,1fr)}
.tabs{display:flex;align-items:flex-end;gap:1px;padding:0 8px;background:var(--case)}
.tabs button{height:24px;padding:0 12px;border-radius:6px 6px 0 0;color:var(--dim)}.tabs button.on{background:var(--deck);color:var(--ink)}.tabs button .tx{margin-left:8px;font-style:normal;opacity:0}.tabs button.on .tx,.tabs button:hover .tx{opacity:1}.tabs .tnew{margin-left:auto;padding:0 6px}.tabs button.drop{box-shadow:inset 2px 0 0 var(--cur)}
.path{display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line);color:var(--dim);white-space:nowrap}.path b{color:var(--ink);font-weight:600}.path em{margin-left:auto;font-style:normal}
.p.act .path{box-shadow:inset 0 2px 0 var(--cur)}
.title{display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--line);color:var(--dim);background:var(--case)}.title b{color:var(--ink);font-weight:600;margin-right:6px}
.r{display:grid;grid-template-columns:minmax(0,1fr) 96px 84px 106px;align-items:center;height:20px;line-height:20px;padding:0 8px;white-space:nowrap}
.r>*{overflow:hidden;text-overflow:ellipsis}.r>:nth-child(2),.r>:nth-child(3),.r>:nth-child(4){color:var(--dim)}.r>:nth-child(3),.r>:nth-child(4){text-align:right}
.hd{height:22px;border-bottom:1px solid var(--line);font-size:11px}.hd button{height:22px;text-align:inherit;color:var(--dim);width:100%}.hd button[aria-sort]{color:var(--ink);font-weight:600}
.name{display:flex;align-items:center;gap:6px;min-width:0}.name span{overflow:hidden;text-overflow:ellipsis}.name small{font-size:11px;color:inherit;opacity:.85;margin-left:4px;font-weight:400;flex:none}
.tk{width:6px;height:6px;border-radius:50%;flex:none}.mk .tk{background:currentColor}
.r.dir .name{font-weight:600}.r.dir .i{color:var(--dim)}
.mk{color:var(--ink)}.mk .name{font-weight:600}.mk>:nth-child(n+2){color:var(--ink)}
.list{overflow:hidden}
.r.cur,.p:not(.act) .r.cur{background:var(--cur);color:var(--cur-ink)}.r.cur>*,.r.cur .i{color:var(--cur-ink)}
.p:not(.act) .r.cur{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--dim)}.p:not(.act) .r.cur>:first-child{color:var(--ink)}.p:not(.act) .r.cur>:nth-child(n+2),.p:not(.act) .r.cur .i{color:var(--dim)}
.r.k-go,.r.k-go>*,.r.k-go .i{color:var(--go-t)}.r.k-go{background:var(--go-bg)}.r.k-go .name{font-weight:600}
.r.k-mv,.r.k-mv>*,.r.k-mv .i{color:var(--mv-t)}.r.k-mv{background:var(--mv-bg)}.r.k-mv .name{font-weight:600}
.r.k-rm,.r.k-rm>*,.r.k-rm .i{color:var(--rm-t)}.r.k-rm{background:var(--rm-bg)}.r.k-rm .name{font-weight:600}
.r.k-skip,.r.k-skip>*{color:var(--dim)}
.r.err{background:var(--line)}.r.err,.r.err>*,.r.err .i{color:var(--ink)}.r.err .name{font-weight:600}
.r.hid .name,.r.hid .name .i{color:var(--dim)}
.r.cur.k-skip,.r.cur.k-rm,.r.cur.k-go,.r.cur.k-mv{background:var(--cur)}.r.cur.k-skip>*,.r.cur.k-rm>*,.r.cur.k-go>*,.r.cur.k-mv>*,.r.cur.k-rm .i,.r.cur.k-skip .i,.r.cur.hid .name,.r.cur.hid .name .i{color:var(--cur-ink)}
.r.enter{animation:arrive .2s cubic-bezier(.16,1,.3,1)}
@keyframes arrive{from{opacity:0;transform:translateY(-6px)}}
.empty{padding:32px 16px;text-align:center;color:var(--dim);line-height:1.5}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px;color:var(--dim);border-top:1px solid var(--line);background:var(--case)}.foot b{color:var(--ink);font-weight:600}.foot .q{display:flex;align-items:center;gap:6px;color:var(--ink)}
.gut{display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);justify-items:center;border-inline:1px solid var(--rim);padding:8px 0;overflow:hidden}
.gt,.gb{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;padding:3px 0}.gt{justify-content:flex-end;width:100%}.gb{justify-content:flex-start}.gt .way{margin-bottom:auto}
.way{display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:8px;border-bottom:1px solid var(--line);width:60px;text-align:center}.way strong{font-size:20px;font-weight:600;letter-spacing:-.02em}.way small{font-size:11px;color:var(--dim)}
.flip .fl{transform:scaleX(-1)}
.k{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:11px;width:80px}
.k b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,var(--key-hi),var(--key) 72%);box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);color:var(--key-ink);transition:transform .14s cubic-bezier(.16,1,.3,1),box-shadow .14s cubic-bezier(.16,1,.3,1)}
.k span{white-space:nowrap;font-size:10.5px;letter-spacing:-.01em}
.k.go b{background:radial-gradient(circle at 38% 30%,var(--go-hi),var(--go) 72%);color:var(--go-ink)}
.k.mv b{background:radial-gradient(circle at 38% 30%,var(--mv-hi),var(--mv) 72%);color:var(--mv-ink)}
.k.rm b{background:radial-gradient(circle at 38% 30%,var(--rm-hi),var(--rm) 72%);color:var(--rm-ink)}
.k:hover b{filter:brightness(1.07)}.k:active b,.k.down b,.k.held b{transform:translateY(2px);box-shadow:0 0 1px rgba(0,0,0,.5),inset 0 2px 3px rgba(0,0,0,.35)}.k.held{color:var(--ink)}
.k:disabled{opacity:.38}.rule{width:44px;height:1px;background:var(--line);flex:none}
.lanes{border-inline:1px solid var(--rim);background:var(--case);padding-top:50px;overflow:hidden}
.lanes .fl{transform:scaleX(-1)}
.lane{height:20px;display:grid;place-items:center;width:100%}.lane.cur{background:var(--cur)}.lane.cur .m.off{color:var(--cur-ink)}
.m{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,var(--key-hi),var(--key) 72%);box-shadow:0 1px 1px rgba(0,0,0,.4);color:var(--key-ink)}
.m.go{background:radial-gradient(circle at 38% 30%,var(--go-hi),var(--go) 72%);color:var(--go-ink)}.m.rm{background:radial-gradient(circle at 38% 30%,var(--rm-hi),var(--rm) 72%);color:var(--rm-ink)}.m.off{background:none;box-shadow:none;color:var(--dim)}
.m.hit{animation:dep .16s cubic-bezier(.16,1,.3,1)}@keyframes dep{from{transform:translateY(1px) scale(.9)}}
#bar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--deck);border-top:1px solid var(--rim);color:var(--dim);white-space:nowrap;overflow:hidden}
#bar b{color:var(--ink);font-weight:600}#bar .sp{margin-left:auto}#bar .t-rm{color:var(--rm-t)}#bar input{height:26px;width:170px;border:1px solid var(--line);border-radius:5px;background:var(--field);padding:0 8px;color:var(--ink);user-select:text}
.prog{flex:1;min-width:80px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--go)}.prog.mv i{background:var(--mv)}.prog.rm i{background:var(--rm)}
.b{height:26px;padding:0 12px;border-radius:5px;background:var(--key);color:var(--key-ink);display:inline-flex;align-items:center;gap:7px}.b kbd{color:inherit;opacity:.72}.b:hover{filter:brightness(1.08)}.b:disabled{opacity:.42;filter:none}
.b.go kbd,.b.mv kbd,.b.rm kbd,.b.pl kbd{opacity:1}.b.go{background:var(--go);color:var(--go-ink);font-weight:600}.b.mv{background:var(--mv);color:var(--mv-ink);font-weight:600}.b.rm{background:var(--rm);color:var(--rm-ink);font-weight:600}.b.pl{background:var(--cur);color:var(--cur-ink);font-weight:600}
.seg{display:inline-flex;background:var(--case);border-radius:6px;padding:2px;gap:1px}.seg button{height:24px;padding:0 10px;border-radius:4px;color:var(--dim)}.seg button.on{background:var(--key);color:var(--key-ink);box-shadow:0 1px 1px rgba(0,0,0,.25)}
.seg kbd{margin-left:5px}.seg button.on kbd{color:inherit;opacity:.72}
.cl{display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid var(--line);color:var(--dim);white-space:nowrap}.cl input{flex:1;height:22px;border:0;background:none;outline-offset:0;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;user-select:text}
.opts{display:flex;align-items:center;gap:10px;padding:0 12px;overflow:hidden;background:var(--case);border-bottom:1px solid var(--rim);white-space:nowrap;color:var(--dim)}
input[type=checkbox]{accent-color:var(--cur)}
.opts label{display:inline-flex;align-items:center;gap:6px}
.opts input[type=text],.opts input[type=number],.opts select{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--field);padding:0 8px;color:var(--ink);user-select:text}
.opts .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}.opts .sp{margin-left:auto}
.ov{position:fixed;inset:0;display:none;justify-content:center;align-items:flex-start;padding-top:78px;background:rgba(0,0,0,.3);z-index:5}.ov.on{display:flex}
.sheet{width:520px;max-height:calc(100vh - 120px);background:var(--deck);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 42px rgba(0,0,0,.42);overflow:hidden;display:flex;flex-direction:column}
.sheet.wide{width:680px}.sheet input{flex:none;height:40px;border:0;border-bottom:1px solid var(--line);background:none;padding:0 14px;font-size:14px;user-select:text;outline:0}
.pal{overflow:auto;padding:4px}.pal button{width:100%;height:28px;padding:0 10px;border-radius:5px;display:flex;align-items:center;gap:8px;text-align:left}.pal button kbd{margin-left:auto}.pal button.on{background:var(--cur);color:var(--cur-ink)}.pal button.on kbd{color:inherit}
.fw{transform:scaleX(-1)}.path .nv{width:18px;height:20px;display:grid;place-items:center;color:var(--ink);flex:none}.path .nv:disabled{color:var(--dim);opacity:.45}
.p.res .r{grid-template-columns:minmax(0,1fr) 230px 84px 106px}
#bar select{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--field);padding:0 6px;color:var(--ink)}
.menu{position:fixed;z-index:6;display:none;width:230px;max-height:calc(100vh - 16px);overflow:auto;padding:4px;background:var(--deck);border:1px solid var(--line);border-radius:7px;box-shadow:0 10px 26px rgba(0,0,0,.4)}.menu.on{display:block}
.menu button{width:100%;height:24px;padding:0 8px;border-radius:4px;display:flex;align-items:center;gap:8px;text-align:left}.menu button kbd{margin-left:auto}.menu button.on{background:var(--cur);color:var(--cur-ink)}.menu button.on kbd{color:inherit}
.menu small{display:block;padding:7px 8px 3px;font-size:11px;color:var(--dim)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.p.vw{grid-template-rows:28px minmax(0,1fr) 24px}
.vh{display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--case);border-bottom:1px solid var(--line);font-weight:600}.vh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vh button{margin-left:auto;height:20px}
.vb{padding:10px 8px;overflow:auto;font:12px/1.55 ui-monospace,"SF Mono",Menlo,monospace;white-space:pre-wrap;user-select:text}
.r input{height:18px;width:100%;border:1px solid var(--cur);border-radius:3px;background:var(--field);color:var(--ink);padding:0 4px;user-select:text}.r.cur input{border-color:var(--cur-ink)}
@media (max-width:1280px){.opts .hint{display:none}.opts input[data-o=name]{width:130px}.opts input[data-o=find],.opts input[data-o=rep]{width:84px}.opts{gap:8px}}
@media (max-height:760px){.k{font-size:0;gap:0}.k span{display:none}.k b{width:30px;height:30px}.gt,.gb{gap:5px}.way small{display:none}.way{gap:2px}}
@media (prefers-reduced-motion:reduce){.r.enter,.m.hit{animation:none}.k b{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="folder" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 3.5a1 1 0 0 1 1-1h3.6l1.5 1.6h5.900a1 1 0 0 1 1 1v7.400a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></symbol>
<symbol id="file" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.2" d="M3.500 1.800h6l3 3v9.400h-9zM9.500 1.800v3h3"/></symbol>
<symbol id="up" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.400" d="M8 13V3.500M4 7l4-4 4 4"/></symbol>
<symbol id="copy" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M5.500 5.500h8v8h-8zM10.500 5.500v-3h-8v8h3"/></symbol>
<symbol id="move" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.600" d="M2 8h11M9 4l4 4-4 4"/></symbol>
<symbol id="trash" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M2.500 4h11M6 4V2.200h4V4M4 4l.7 10h6.600L12 4"/></symbol>
<symbol id="eye" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M1.500 8S4 3.500 8 3.500 14.500 8 14.500 8 12 12.500 8 12.500 1.500 8 1.500 8zM8 6.200a1.800 1.800 0 1 0 0 3.600 1.800 1.800 0 0 0 0-3.600z"/></symbol>
<symbol id="edit" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M2.500 13.500l.8-3.300 7.700-7.700 2.500 2.500-7.700 7.700zM9.500 4L12 6.500"/></symbol>
<symbol id="plus" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.600" d="M8 2.500v11M2.500 8h11"/></symbol>
<symbol id="check" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.800" d="M3 8.500l3.300 3.300L13 4.500"/></symbol>
<symbol id="search" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M7 2.500a4.500 4.500 0 1 0 0 9 4.500 4.500 0 0 0 0-9zM10.500 10.500L14 14"/></symbol>
<symbol id="rename" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M2 4.500h12v7H2zM5 2.500h6M8 2.500v11M5 13.500h6"/></symbol>
<symbol id="compare" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M1.800 2.800h5v10.400h-5zM9.200 2.800h5v10.400h-5zM9.200 6h5M9.200 9.500h5"/></symbol>
<symbol id="alert" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M8 2l6.500 11.500h-13zM8 6.500v3.500M8 11.300v.9"/></symbol>
<symbol id="dash" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 8h8"/></symbol>
<symbol id="equal" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.800" d="M4 6h8M4 10h8"/></symbol>
<symbol id="archive" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M2 3h12v3H2zM3 6v7.500h10V6M6.500 8.800h3"/></symbol>
<symbol id="unpack" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M2 3h12v3H2zM3 6v7.500h10V6M8 12V8M6 9.800L8 7.800l2 2"/></symbol>
<symbol id="chev" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.700" d="M10 3L5 8l5 5"/></symbol>
<symbol id="term" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.500" d="M1.800 2.800h12.400v10.400H1.800zM4.500 6l2 2-2 2M8.500 10.500h3"/></symbol>
<symbol id="close" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.600" d="M4 4l8 8M12 4l-8 8"/></symbol>
</defs></svg>

<header class="top"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
<button class="cmd" data-a="palette" aria-label="Run a command"><svg class="i" width="13" height="13"><use href="#search"/></svg>Run a command<kbd>⌘K</kbd></button><span id="mini"></span></header>

<main id="stage">
<section id="v-browse" class="view on" aria-label="Browse">
<div class="p" id="p0"></div><div class="gut" id="gut"></div><div class="p" id="p1"></div>
</section>
<section id="v-rename" class="view" aria-label="Multi-rename"><div class="opts" id="rnOpts"></div>
<div class="split"><div class="p plain act"><div class="title"><b>Before</b><span id="rnFrom"></span></div><div class="r hd"><span>Name</span><span>Ext</span><span>Size</span><span>Modified</span></div><div class="list" id="rnL"></div></div>
<div class="lanes" id="rnM"></div>
<div class="p plain act"><div class="title"><b>After</b><span id="rnCount"></span></div><div class="r hd"><span>Name</span><span>Ext</span><span>Size</span><span>Modified</span></div><div class="list" id="rnR"></div></div></div></section>
<section id="v-compare" class="view" aria-label="Compare and sync"><div class="opts" id="cpOpts"></div>
<div class="split"><div class="p plain act"><div class="title"><b>docs</b><span>~/projects/atlas</span></div><div class="r hd"><span>Name</span><span></span><span>Size</span><span>Modified</span></div><div class="list" id="cpL"></div></div>
<div class="lanes" id="cpM"></div>
<div class="p plain act"><div class="title"><b>docs</b><span>Archive T7 / backups / atlas</span></div><div class="r hd"><span>Name</span><span></span><span>Size</span><span>Modified</span></div><div class="list" id="cpR"></div></div></div></section>
</main>

<div id="bar" role="status" aria-live="polite"></div>

    if(k==='Escape'&&!S.job)closeMode();else if(k==='Enter'){stop();if(!S.job)runSync()}else if(k==='ArrowDown'||k==='ArrowUp'){stop();cp.cur=Math.max(0,Math.min(cpVis().length-1,cp.cur+(k==='ArrowDown'?1:-1)));cpLists()}
    else if(k==='ArrowRight'){stop();cpSet('r')}else if(k==='ArrowLeft'){stop();cpSet('l')}else if(k==='-')cpSet('-');else if(lk==='x')cpSet('x');else if(lk==='d')cpOnly(!cp.only);else if(lk==='a')cpAllow(!cp.del);else if('123'.includes(k)){cp.by=['date','size','content'][k-1];cpAuto(cp);cpOpts();cpLists()}

  if(k.startsWith('F')&&k.length<=3){const f={F2:startIR,F3:viewer,F4:edit,F5:()=>begin('copy'),F6:()=>begin('move'),F7:newFolder,F8:()=>begin('trash')}[k];if(f){stop();f()}return}

    if(k==='Backspace'){stop();return begin('trash')}if(m&&!sh){stop();return m()}return}
